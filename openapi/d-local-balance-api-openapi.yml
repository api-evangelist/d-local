openapi: 3.2.0
info:
  title: dLocal Payouts V3 Balance API
  version: '3.0'
  description: 'Disburse funds to beneficiaries in emerging markets via local bank

    transfers, instant payments, mobile money, cards, and cash pick-up.

    Payouts V3 uses OAuth2 Bearer tokens for authentication (rather than

    the HMAC signature scheme used by Payins).

    '
  contact:
    name: dLocal Support
    url: https://docs.dlocal.com/
servers:
- url: https://api.dlocal.com
  description: Production
- url: https://sandbox.dlocal.com
  description: Sandbox
security:
- bearerAuth: []
tags:
- name: Balance
  description: Inspect available merchant balance for payouts.
paths:
  /payouts/v3/balance:
    get:
      tags:
      - Balance
      operationId: getPayoutsBalance
      summary: Get Payouts Balance
      description: Retrieve the merchant's available payout balance.
      responses:
        '200':
          description: Balance returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
components:
  schemas:
    Balance:
      type: object
      properties:
        currency:
          type: string
        available_balance:
          type: number
        previous_day_closing_balance:
          type: number
        current_balance_date:
          type: string
          format: date
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
